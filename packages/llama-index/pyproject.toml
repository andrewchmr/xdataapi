[project]
name = "llama-index-tools-xdataapi"
version = "0.1.0"
description = "LlamaIndex tool spec for xdataapi.io: read-only public X (Twitter) profiles, tweets, threads, followers and search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<4.0"
keywords = [
  "llama-index", "llamaindex", "llamahub", "agents", "tools", "twitter", "x",
  "twitter-api", "x-api", "llm", "xdataapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "llama-index-core>=0.12.0,<0.15",
  "httpx>=0.27.0,<0.29.0",
]

[project.urls]
Homepage = "https://xdataapi.io"
Documentation = "https://xdataapi.io/docs"
"API reference" = "https://xdataapi.io/reference"
"Source code" = "https://github.com/xdataapi/xdataapi"
"Issue tracker" = "https://github.com/xdataapi/xdataapi/issues"

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.xdataapi"

[tool.llamahub.class_authors]
XdataapiToolSpec = "xdataapi"
