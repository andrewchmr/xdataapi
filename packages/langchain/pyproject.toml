[project]
name = "langchain-xdataapi"
version = "0.1.0"
description = "LangChain tools for xdataapi.io: read-only public X (Twitter) profiles, tweets, threads, followers and search."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "langchain", "langgraph", "agents", "tools", "twitter", "x", "twitter-api",
  "x-api", "mcp", "llm", "xdataapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langchain-core>=0.3.0,<2.0.0",
  "httpx>=0.27.0,<0.29.0",
  "pydantic>=2.7.0,<3.0.0",
]

[project.urls]
Homepage = "https://xdataapi.io"
Documentation = "https://xdataapi.io/docs"
"API reference" = "https://xdataapi.io/reference"
"Source code" = "https://github.com/xdataapi/xdataapi"
"Issue tracker" = "https://github.com/xdataapi/xdataapi/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_xdataapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
